name: Droidian Kernel (OnePlus 11 / salami)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build kernel .deb packages
    runs-on: ubuntu-latest
    container:
      image: quay.io/droidian/build-essential:bookworm-amd64
      options: --privileged

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install linux-packaging-snippets
        run: |
          # The container image has stale Droidian repo keys (NO_PUBKEY 5E775B2A27AB0C94).
          # Update ignoring signature errors; the package index is already cached in the image.
          apt-get update --allow-insecure-repositories -o Acquire::AllowInsecureRepositories=true || true
          apt-get install -y --allow-unauthenticated --no-install-recommends linux-packaging-snippets

      - name: Diagnose releng-build-package
        run: |
          echo "=== releng-build-package script ==="
          cat $(which releng-build-package) || find /usr -name releng-build-package 2>/dev/null | head -3 | xargs cat
          echo "=== installed snippets files ==="
          dpkg -L linux-packaging-snippets | head -40

      - name: Configure gbp branch
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"
          # releng-build-package reads upstream-branch from debian/gbp.conf
          # to do git checkout origin/<upstream-branch>. Provide our branch.
          cat > debian/gbp.conf << EOF
          [DEFAULT]
          upstream-branch = $BRANCH
          upstream-tag = upstream/%(version)s
          debian-branch = $BRANCH
          sign-tags = False
          EOF
          echo "=== debian/gbp.conf ==="
          cat debian/gbp.conf

      - name: Build kernel packages
        env:
          PARENT: ${{ github.ref_name }}
          UPSTREAM_BRANCH: ${{ github.ref_name }}
        run: |
          releng-build-package

      - name: Collect .deb artifacts
        run: |
          mkdir -p /tmp/out
          find . -maxdepth 1 -name "*.deb" -exec cp {} /tmp/out/ \;
          ls -lh /tmp/out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-oneplus-salami
          path: /tmp/out/*.deb
          if-no-files-found: error
