name: Droidian Kernel (OnePlus 11 / salami)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build kernel .deb packages
    runs-on: ubuntu-latest
    container:
      image: quay.io/droidian/build-essential:bookworm-amd64
      options: --privileged

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install linux-packaging-snippets
        run: |
          # The container image has stale Droidian repo keys (NO_PUBKEY 5E775B2A27AB0C94).
          # Update ignoring signature errors; the package index is already cached in the image.
          apt-get update --allow-insecure-repositories -o Acquire::AllowInsecureRepositories=true || true
          apt-get install -y --allow-unauthenticated --no-install-recommends linux-packaging-snippets

      - name: Build kernel packages
        env:
          # releng-build-package detects container environments via IS_CONTAINER.
          # GitHub Actions is not in its CI list, so BRANCH stays empty and
          # git checkout origin/${BRANCH} fails. IS_CONTAINER=true makes it use
          # git rev-parse --abbrev-ref HEAD instead.
          IS_CONTAINER: "true"
        run: |
          # GitHub Actions does not persist the safe.directory set by actions/checkout
          # into the container's HOME. Configure it here so git commands work.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          releng-build-package

      - name: Collect .deb artifacts
        run: |
          mkdir -p /tmp/out
          find . -maxdepth 1 -name "*.deb" -exec cp {} /tmp/out/ \;
          ls -lh /tmp/out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-oneplus-salami
          path: /tmp/out/*.deb
          if-no-files-found: error
