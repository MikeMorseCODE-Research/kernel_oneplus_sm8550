name: Droidian Kernel (OnePlus 11 / salami)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build kernel .deb packages
    runs-on: ubuntu-latest
    container:
      image: quay.io/droidian/build-essential:bookworm-amd64
      options: --privileged

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install linux-packaging-snippets
        run: |
          # The container image has stale Droidian repo keys (NO_PUBKEY 5E775B2A27AB0C94).
          # Update ignoring signature errors; the package index is already cached in the image.
          apt-get update --allow-insecure-repositories -o Acquire::AllowInsecureRepositories=true || true
          apt-get install -y --allow-unauthenticated --no-install-recommends linux-packaging-snippets

      - name: Build kernel packages
        env:
          # releng-build-package detects container environments via IS_CONTAINER.
          # GitHub Actions is not in its CI list, so BRANCH stays empty and
          # git checkout origin/${BRANCH} fails. IS_CONTAINER=true makes it use
          # git rev-parse --abbrev-ref HEAD instead.
          IS_CONTAINER: "true"
          # Tell debuild to cross-compile for arm64.
          RELENG_HOST_ARCH: "arm64"
        run: |
          # GitHub Actions does not persist the safe.directory set by actions/checkout
          # into the container's HOME. Configure it here so git commands work.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The Droidian container has stale GPG keys. releng-build-package runs its
          # own internal apt-get update, so we must configure APT system-wide to
          # tolerate unsigned repos before calling it.
          echo 'Acquire::AllowInsecureRepositories "true";' > /etc/apt/apt.conf.d/99allow-insecure
          echo 'Acquire::AllowDowngradeToInsecureRepositories "true";' >> /etc/apt/apt.conf.d/99allow-insecure
          # The vendor kernel has ~30 symlinks pointing into sm8550-modules and
          # sm8550-devicetrees which are separate repos not checked out here.
          # Kconfig traversal hits them unconditionally; stub each dangling symlink
          # with a real directory + empty Kconfig + Makefile so the build can proceed.
          find . -maxdepth 10 -type l 2>/dev/null | while IFS= read -r link; do
            if ! test -e "$link"; then
              echo "Stubbing dangling symlink: $link"
              rm "$link"
              mkdir -p "$link"
              touch "$link/Kconfig" "$link/Makefile"
            fi
          done
          releng-build-package

      - name: Collect .deb artifacts
        run: |
          mkdir -p /tmp/out
          find . -maxdepth 1 -name "*.deb" -exec cp {} /tmp/out/ \;
          ls -lh /tmp/out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-oneplus-salami
          path: /tmp/out/*.deb
          if-no-files-found: error
